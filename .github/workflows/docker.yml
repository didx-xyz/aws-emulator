name: Docker

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docker:
    name: Build / Push
    runs-on: ubuntu-26.04
    timeout-minutes: 30

    permissions:
      contents: read
      packages: write

    env:
      # Fork and Dependabot PRs get a read-only token, so they build without pushing.
      PUSH: ${{ github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]') }}
      # The daily cron, or a manual run on the default branch, publishes the release tags.
      RELEASE: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.ref_name == github.event.repository.default_branch) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: QEMU setup
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Docker Buildx setup
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: GHCR Login
        if: env.PUSH == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Docker Metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
          DOCKER_METADATA_PR_HEAD_SHA: true
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |-
            type=raw,value=latest,enable=${{ env.RELEASE }}
            type=raw,value=lts,enable=${{ env.RELEASE }}
            type=raw,value={{date 'YYYYMMDD'}},enable=${{ env.RELEASE }}
            type=raw,value=lts-{{date 'YYYYMMDD'}},enable=${{ env.RELEASE }}
            type=ref,event=branch,enable=${{ github.event_name == 'push' }}
            type=ref,event=branch,suffix=-{{sha}},enable=${{ github.event_name == 'push' }}
            type=ref,event=pr
            type=ref,event=pr,suffix=-{{sha}}

      # No layer cache and a fresh base image pull, so every build installs the latest release.
      # Manual runs on other branches produce no tags, so they build without pushing.
      - name: Docker Build / Push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          pull: true
          push: ${{ env.PUSH == 'true' && steps.meta.outputs.tags != '' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
