services:
  aws-emulator:
    image: ghcr.io/didx-xyz/aws-emulator:lts
    build: .
    mem_limit: 2g
    memswap_limit: 2g
    ports:
      - 127.0.0.1:9297:9297
    volumes:
      - emulator:/home/emulator/.aws/emulator

  # Shares the emulator's network, so 127.0.0.1:9297 matches the emulator's certificate.
  aws-cli:
    image: public.ecr.aws/aws-cli/aws-cli:latest
    network_mode: service:aws-emulator
    depends_on:
      aws-emulator:
        condition: service_healthy
    volumes:
      - emulator:/home/emulator/.aws/emulator:ro
    environment:
      AWS_ENDPOINT_URL: https://127.0.0.1:9297
      AWS_SHARED_CREDENTIALS_FILE: /home/emulator/.aws/emulator/9297/emulator_credentials
      AWS_CONFIG_FILE: /home/emulator/.aws/emulator/9297/config
      AWS_CA_BUNDLE: /home/emulator/.aws/emulator/9297/ca.pem
      AWS_EC2_METADATA_DISABLED: "true"
      AWS_DISABLE_HOST_PREFIX_INJECTION: "true"
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |-
        set -e
        aws sts get-caller-identity
        aws s3 mb s3://demo
        aws s3 ls

volumes:
  emulator:
